name: passageiro
description: "10 é + Passageiro — app do cliente (MVP-A)."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # O mapa (vetorial Console Noturno + fallback raster) vive no pacote
  # compartilhado `ten_map` — o app não importa `flutter_map`/`maplibre_gl`
  # direto, só o pacote.
  http: ^1.2.0
  intl: ^0.19.0
  latlong2: ^0.10.1
  web: ^1.1.1
  shared_preferences: ^2.3.2
  geolocator: ^14.1.2
  # Design system compartilhado (tokens, tipografia, componentes).
  ten_design:
    path: ../../packages/ten_design
  # Mapa compartilhado (Console Noturno + fallback raster + camadas).
  ten_map:
    path: ../../packages/ten_map
  # Mapas: abstração MapProvider (R1) — implementação Google/OSM entra no
  # módulo de mapas; por ora o contrato já isola o ponto de troca.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Kit de marca 10 é + (10-e-mais-HD/ otimizado p/ bundle ~1,5 MB).
  assets:
    - assets/10-e-mais-logos/
    - assets/10-e-mais-logos/png/
    - assets/10-e-mais-logos/svg/
    - assets/10-e-mais-carrossel-login-sem-logo/png/
    - assets/10-e-mais-carrossel-raspadinha-sem-logo/png/
