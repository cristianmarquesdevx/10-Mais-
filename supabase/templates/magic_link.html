<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Seu código de acesso</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f5;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:28px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:480px;background:#ffffff;border-radius:14px;padding:28px;">
          <tr>
            <td>
              <p style="margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#05998c;font-weight:700;">
                10 é +
              </p>
              <h1 style="margin:0 0 16px;font-size:21px;color:#1b2224;">Seu código de acesso</h1>
              <p style="margin:0 0 18px;font-size:15px;line-height:1.5;color:#4a5457;">
                Use o código abaixo para entrar no app. Ele vale por 1 hora e só
                pode ser usado uma vez.
              </p>
              <p style="margin:0 0 18px;font-size:34px;letter-spacing:.28em;font-weight:700;color:#1b2224;">
                {{ .Token }}
              </p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#7b8588;">
                Se você não pediu este código, ignore esta mensagem: ninguém entra
                na sua conta sem ele.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-size:12px;color:#9aa4a7;">
          Porto Velho · Rondônia
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
